name: Build ImmortalWrt for 360T7 (U-Boot layout)

# 基于 chasey-dev/immortalwrt-mt798x-rebase 云编译 360T7 (MT7981B) 固件。
# 默认 layout=uboot-108m 适配 hanwckf/bl-mt798x 108M 自定义 U-Boot（大分区）：
#   产物为 *-squashfs-factory.bin（U-Boot 首次刷写）与 *-squashfs-sysupgrade.bin（系统内升级）
# 由 patches/0001-mediatek-add-360t7-uboot-layout.patch 新增 qihoo_360t7-uboot 设备实现。

on:
  workflow_dispatch:
    inputs:
      layout:
        description: "分区布局：uboot-108m = hanwckf 108M 自定义 U-Boot（factory.bin/sysupgrade.bin）；fit-108m = OpenWrt U-Boot（sysupgrade.itb）；ubi-127m = 新版全 UBI 127M"
        type: choice
        default: uboot-108m
        options:
          - uboot-108m
          - fit-108m
          - ubi-127m
      source_ref:
        description: "上游分支（chasey-dev/immortalwrt-mt798x-rebase）"
        type: string
        default: "25.12"
      extra_packages:
        description: "额外编译的软件包（空格分隔，例如 luci-app-ttyd upnp）"
        type: string
        default: ""
  schedule:
    # 每天北京时间 02:00 检查上游是否有新提交，有更新才编译
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: build-360t7
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  UPSTREAM_REPO: 123asd789/immortalwrt-mt798x-rebase

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Resolve upstream commit
        id: upstream
        env:
          SOURCE_REF: ${{ inputs.source_ref || '25.12' }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" "refs/heads/${SOURCE_REF}" | awk '{print $1}')
          test -n "$sha"
          last=""
          if [ -f .last_sync_commit ]; then last=$(cat .last_sync_commit); fi
          need="true"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$sha" ]; then need="false"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "Upstream ${SOURCE_REF} @ ${sha}, build needed: ${need}" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when upstream unchanged
        if: steps.upstream.outputs.need == 'false'
        run: echo "上游无新提交，跳过编译。" >> "$GITHUB_STEP_SUMMARY"

      - name: Clone source
        if: steps.upstream.outputs.need == 'true'
        env:
          SOURCE_REF: ${{ steps.upstream.outputs.ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${SOURCE_REF}" "https://github.com/${UPSTREAM_REPO}.git" openwrt

      - name: Apply local patches
        if: steps.upstream.outputs.need == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "::group::apply $p"
            git -C openwrt apply --3way "$(realpath "$p")" \
              || git -C openwrt apply -p1 "$(realpath "$p")"
            echo "::endgroup::"
          done

      - name: Update feeds
        if: steps.upstream.outputs.need == 'true'
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare config
        if: steps.upstream.outputs.need == 'true'
        env:
          LAYOUT: ${{ inputs.layout || 'uboot-108m' }}
          EXTRA: ${{ inputs.extra_packages || '' }}
        run: |
          set -euo pipefail
          case "${LAYOUT}" in
            uboot-108m) config=configs/360t7-uboot-108m.config; device=qihoo_360t7-uboot ;;
            fit-108m)   config=configs/360t7-fit-108m.config;   device=qihoo_360t7 ;;
            ubi-127m)   config=configs/360t7-ubi-127m.config;   device=qihoo_360t7-ubi ;;
            *) echo "未知布局: ${LAYOUT}"; exit 1 ;;
          esac
          cp "$config" openwrt/.config
          cd openwrt
          # 配置文件可以来自任意 menuconfig，设备/目标行一律以 layout 为准，
          # 避免用户沿用 stock/FIT 设备导致布局不匹配。
          sed -i -e '/^CONFIG_TARGET_PROFILE=/d' \
                 -e '/^CONFIG_TARGET_mediatek_filogic_DEVICE_/d' \
                 -e '/^# CONFIG_TARGET_mediatek_filogic_DEVICE_/d' .config
          {
            echo "CONFIG_TARGET_mediatek=y"
            echo "CONFIG_TARGET_mediatek_filogic=y"
            echo "CONFIG_TARGET_mediatek_filogic_DEVICE_${device}=y"
            echo "CONFIG_TARGET_PROFILE=\"DEVICE_${device}\""
          } >> .config
          # 使用 MTK 私有 mt_wifi 驱动（本 rebase 仓库不含 mt76）。
          # 外部导入的完整配置若有相关的 "is not set" 行，先删除再显式启用。
          sed -i -E '/^# CONFIG_(PACKAGE_kmod-mt_wifi|PACKAGE_mtwifi-cfg-ucode|PACKAGE_luci-app-mtwifi-cfg|MTK_(MT_WIFI|FIRST_IF_MT7981|CHIP_MT7981)) is not set$/d' .config
          for opt in \
            CONFIG_PACKAGE_kmod-mt_wifi \
            CONFIG_MTK_MT_WIFI \
            CONFIG_MTK_FIRST_IF_MT7981 \
            CONFIG_MTK_CHIP_MT7981 \
            CONFIG_PACKAGE_mtwifi-cfg-ucode \
            CONFIG_PACKAGE_luci-app-mtwifi-cfg; do
            echo "${opt}=y" >> .config
          done
          for pkg in ${EXTRA}; do
            echo "CONFIG_PACKAGE_${pkg}=y" >> .config
          done
          make defconfig
          grep -q "^CONFIG_TARGET_mediatek_filogic_DEVICE_${device}=y$" .config \
            || { echo "设备 ${device} 未被选中"; exit 1; }
          grep -q "^CONFIG_PACKAGE_kmod-mt_wifi=y$" .config \
            || { echo "kmod-mt_wifi 未被启用"; exit 1; }
          grep -q "^CONFIG_MTK_CHIP_MT7981=y$" .config \
            || { echo "MTK_CHIP_MT7981 未选中"; exit 1; }
          for pkg in mtwifi-cfg-ucode luci-app-mtwifi-cfg; do
            grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config \
              || { echo "WiFi 包 ${pkg} 未被启用"; exit 1; }
          done
          {
            echo "### 配置摘要"
            echo '```'
            grep -E "^CONFIG_TARGET_(mediatek|PROFILE)" .config || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download sources
        if: steps.upstream.outputs.need == 'true'
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" download || make -j"$(nproc)" download || make -j1 download

      - name: Compile firmware
        if: steps.upstream.outputs.need == 'true'
        run: |
          set -euo pipefail
          cd openwrt
          make -j"$(nproc)" 2>&1 | tee build.log

      - name: Show detailed error (on failure)
        if: failure() && steps.upstream.outputs.need == 'true'
        run: |
          set -uo pipefail
          [ -f openwrt/.config ] || { echo "no .config, failure happened before compile"; exit 0; }
          cd openwrt
          make -j1 V=s 2>&1 | tail -n 250 || true

      - name: Collect images
        if: steps.upstream.outputs.need == 'true'
        run: |
          set -euo pipefail
          cd openwrt/bin/targets/mediatek/filogic
          rm -rf packages
          ls -lh
          sha256sum *.itb *.fip *.bin *.manifest profiles.json 2>/dev/null > SHA256SUMS || true
          cat SHA256SUMS 2>/dev/null || true

      - name: Upload artifacts
        if: steps.upstream.outputs.need == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360t7-${{ inputs.layout || 'uboot-108m' }}-${{ steps.date.outputs.date }}-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*.itb
            openwrt/bin/targets/mediatek/filogic/*.fip
            openwrt/bin/targets/mediatek/filogic/*.bin
            openwrt/bin/targets/mediatek/filogic/*.manifest
            openwrt/bin/targets/mediatek/filogic/SHA256SUMS
            openwrt/bin/targets/mediatek/filogic/profiles.json
            openwrt/bin/targets/mediatek/filogic/config.buildinfo
            openwrt/bin/targets/mediatek/filogic/feeds.buildinfo
          retention-days: 90
          if-no-files-found: error

      - name: Upload failure logs
        if: failure() && steps.upstream.outputs.need == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            openwrt/build.log
            openwrt/logs/
          retention-days: 14
          if-no-files-found: warn

      - name: Create release
        if: steps.upstream.outputs.need == 'true' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          TITLE="360T7 固件 ${{ steps.date.outputs.date }} #${{ github.run_number }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          ## 360T7 (MT7981B) 固件

          - 编译日期：${{ steps.date.outputs.date }}
          - 分区布局：`${{ inputs.layout || 'uboot-108m' }}`
          - 上游源码：123asd789/immortalwrt-mt798x-rebase（含 hnat 补充） @ ${{ steps.upstream.outputs.ref }} (${{ steps.upstream.outputs.sha }})
          - 固件版本：ImmortalWrt 25.12

          ### 本次布局的文件
          - `uboot-108m`（hanwckf 108M 自定义 U-Boot 布局）：`*-squashfs-factory.bin`（U-Boot 首次刷写）、`*-squashfs-sysupgrade.bin`（系统内升级）
          - `fit-108m`（OpenWrt U-Boot 布局）：`*-squashfs-sysupgrade.itb` + `-bl31-uboot.fip`、`-preloader.bin`
          - `ubi-127m`（新版全 UBI 布局）：`*-squashfs-sysupgrade.itb`

          ### 刷机（uboot-108m / 108M 大分区 U-Boot）
          1. 网线连接 360T7 的 LAN 口，电脑设置静态 IP `192.168.1.2/24`；
          2. 断电，按住 reset 键上电约 5 秒，进入 U-Boot Web 恢复页面（默认 `http://192.168.1.1`）；
          3. 首次刷写：上传 `*-squashfs-factory.bin`（会重建 UBI，清空原数据）；
          4. 已有系统内升级：上传 `*-squashfs-sysupgrade.bin`（可保留配置）；
          5. 等待写入完成后设备自动重启。

          > 仅适用于 108M 自定义 U-Boot 布局（ubi 从 `0x580000` 开始、大小 108M，kernel/rootfs 卷）。
          > 不要与 OpenWrt U-Boot 布局（fit-108m）固件混刷。详细说明见仓库 README。
          EOF
          cd openwrt/bin/targets/mediatek/filogic
          shopt -s nullglob
          assets=( ./*.itb ./*.fip ./*.bin ./*.manifest ./profiles.json ./SHA256SUMS ./*.buildinfo )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" "${assets[@]}"
          fi

      - name: Record upstream commit
        if: steps.upstream.outputs.need == 'true' && success()
        run: |
          set -euo pipefail
          echo "${{ steps.upstream.outputs.sha }}" > .last_sync_commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sync_commit
          git commit -m "chore: record upstream ${{ steps.upstream.outputs.sha }}" || true
          git push || true
